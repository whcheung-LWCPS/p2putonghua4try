        body {

            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
            min-height: 100vh;
        }
        /* 電視直播間邊框樣式 */
        .tv-frame {
            background: linear-gradient(145deg, #1e293b, #0f172a);

            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.3);

        /* 詞語卡片互動 hover 及拖拽效果 */

            touch-action: manipulation;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

            box-shadow: 0 8px 12px -2px rgba(0, 0, 0, 0.12);

        function playSound(type) {
            if (isMuted) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    // 答對雙提示音
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.12);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    // 答錯低音
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(174.61, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function showAudioIndicator(text) {

        }

        function hideAudioIndicator() {
            const badge = document.getElementById('audio-status-badge');
            if (badge) badge.classList.add('hidden');
        }

        function pcmToWav(pcm16Array, sampleRate) {
            const numChannels = 1;
            const bytesPerSample = 2;
            const blockAlign = numChannels * bytesPerSample;
            const byteRate = sampleRate * blockAlign;
            const dataSize = pcm16Array.length * bytesPerSample;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            const writeString = (v, offset, str) => {
                for (let i = 0; i < str.length; i++) v.setUint8(offset + i, str.charCodeAt(i));
            };

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < pcm16Array.length; i++, offset += 2) {
                view.setInt16(offset, pcm16Array[i], true);
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        async function speakWithGeminiTTS(text) {
            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                
                // 直接傳送純中文，確保 AI 自動識別並以標準普通話讀出
                const payload = {
                    contents: [{
                        parts: [{ text: text }]
                    }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: "Sulafat" } // 暖心標準國語女聲
                            }
                        }
                    }
                };

                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) return false;

                const data = await res.json();
                const part = data.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType || "";

                if (audioData) {
                    let sampleRate = 24000;
                    const match = mimeType.match(/rate=(\d+)/);
                    if (match && match[1]) sampleRate = parseInt(match[1], 10);

                    const pcmBuffer = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmBuffer);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    
                    const audio = new Audio(audioUrl);
                    await new Promise((resolve) => {
                        audio.onended = () => resolve(true);
                        audio.onerror = () => resolve(false);
                        audio.play().catch(() => resolve(false));
                    });
                    return true;
                }
            } catch (e) {
                console.warn("Gemini TTS API error:", e);
            }
            return false;
        }

        function speakWithGoogleTTS(text) {
            return new Promise((resolve) => {

                    const audio = new Audio(url);
                    audio.onended = () => resolve(true);
                    audio.onerror = () => resolve(false);
                    audio.play().then(() => {}).catch(() => resolve(false));
                } catch(e) {
                    resolve(false);
                }
            });
        }

        function getMandarinVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices();
            if (!voices || voices.length === 0) return null;

            // 嚴格檢測並排除廣東話 / 粵語語音包
            const isCantonese = (v) => {
                const lang = (v.lang || '').toLowerCase();
                const name = (v.name || '').toLowerCase();
                return lang.includes('hk') || lang.includes('yue') || name.includes('cantonese') || name.includes('hong kong') || name.includes('sin-ji');
            };

            // 第一優先：標準 zh-CN / zh-Hans
            let v = voices.find(v => !isCantonese(v) && (v.lang.toLowerCase() === 'zh-cn' || v.lang.toLowerCase() === 'zh_cn' || v.lang.toLowerCase() === 'zh-hans-cn'));
            
            // 第二優先：知名普通話語音庫名稱 (TingTing, Yaoyao, HuiHui, Putonghua)
            if (!v) {
                const kw = ['mandarin', 'putonghua', 'tingting', 'yaoyao', 'huihui', 'kangkang', 'cmn', 'zh-hans'];
                v = voices.find(v => !isCantonese(v) && kw.some(k => v.lang.toLowerCase().includes(k) || v.name.toLowerCase().includes(k)));
            }

            // 第三優先：國語 zh-TW 台灣國語（比粵語更符合普通話教學需要）
            if (!v) {
                v = voices.find(v => !isCantonese(v) && (v.lang.toLowerCase().includes('tw') || v.name.toLowerCase().includes('taiwan')));
            }

            return v;
        }

        function speakWithWebSpeechMandarin(text) {
            if (!('speechSynthesis' in window)) {
                hideAudioIndicator();
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.85;

            const mandarinVoice = getMandarinVoice();
            if (mandarinVoice) {
                utterance.voice = mandarinVoice;
                utterance.onend = hideAudioIndicator;
                utterance.onerror = hideAudioIndicator;
                window.speechSynthesis.speak(utterance);
            } else {
                // 如果裝置完全沒有普通話語音庫，寧可不發聲也不播放廣東話，並於1.2秒後隱藏指示標籤
                console.warn("裝置暫無普通話語音庫，已自動封鎖廣東話播放。");
                setTimeout(hideAudioIndicator, 1200);
            }
        }

        async function speakMandarin(text, event) {
            if (event) event.stopPropagation();

            showAudioIndicator(text);

            // 第一層：Gemini AI TTS 標準國語
            const geminiSuccess = await speakWithGeminiTTS(text);
            if (geminiSuccess) {
                hideAudioIndicator();
                return;
            }

            // 第二層：線上標準普通話音訊
            const onlineSuccess = await speakWithGoogleTTS(text);
            if (onlineSuccess) {
                hideAudioIndicator();
                return;
            }

            // 第三層：Web Speech API（嚴格過濾並排除廣東話）
            speakWithWebSpeechMandarin(text);
        }

        function speakFullSentence() {
            if (!currentWeather) return;
            speakMandarin(`現在為大家播報天氣，今天${currentWeather.word}`);
        }

        function handleDragOver(e) {
            e.preventDefault();
            document.getElementById('drop-target').classList.add('drag-over');
        }

        function handleDragLeave(e) {
            document.getElementById('drop-target').classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('drop-target').classList.remove('drag-over');
            const wordId = e.dataTransfer.getData('text/plain');
            const targetItem = WEATHER_DATA.find(w => w.id === wordId);
            if (targetItem) checkAnswer(targetItem);
        }

        function handleWordCardClick(item) {
            checkAnswer(item);
        }

        function checkAnswer(item) {
            const dropTarget = document.getElementById('drop-target');
            const feedbackEl = document.getElementById('feedback-message');
            const readBtn = document.getElementById('btn-read-sentence');

            if (item.id === currentWeather.id) {
                // 答對邏輯
                playSound('correct');
                dropTarget.innerHTML = `<span class="font-black text-amber-300 text-xl md:text-2xl animate-pulse">${item.word}</span>`;
                dropTarget.classList.remove('border-dashed', 'border-sky-400/80');
                dropTarget.classList.add('border-solid', 'border-emerald-400', 'bg-emerald-950/80');

                feedbackEl.innerText = "🎉 太棒了！答對了！";
                feedbackEl.className = "text-xs md:text-sm font-bold text-emerald-600 mt-1 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 shadow-sm block animate-bounce";
                
                readBtn.classList.remove('hidden');

                // 答對五彩紙屑動畫
                if (window.confetti) {
                    confetti({
                        particleCount: 65,
                        spread: 60,
                        origin: { y: 0.7 }
                    });
                }
            } else {
                // 答錯邏輯
                playSound('wrong');
                feedbackEl.innerText = `❌ 不對哦，這是「${currentWeather.word}」嗎？再想想看～`;
                feedbackEl.className = "text-xs md:text-sm font-bold text-rose-600 mt-1 px-3 py-1 rounded-full bg-rose-50 border border-rose-200 shadow-sm block";
            }
        }

        function clearSlot() {
            const dropTarget = document.getElementById('drop-target');
            dropTarget.innerHTML = `<span id="drop-placeholder" class="text-xs text-sky-400 font-normal">拖曳或點擊詞語</span>`;
            dropTarget.className = "drop-zone min-w-[110px] md:min-w-[130px] h-10 md:h-12 bg-slate-900/90 border-2 border-dashed border-sky-400/80 rounded-lg flex items-center justify-center px-2 text-amber-300 shadow-inner text-lg md:text-xl cursor-pointer hover:border-amber-300";
            document.getElementById('btn-read-sentence').classList.add('hidden');
            document.getElementById('feedback-message').classList.add('hidden');
        }

        function renderWordGrid() {
            const grid = document.getElementById('words-grid');
            grid.innerHTML = '';

            WEATHER_DATA.forEach(item => {
                const card = document.createElement('div');
                card.className = "drag-card bg-sky-50/90 hover:bg-amber-50 border-2 border-sky-200 hover:border-amber-400 rounded-xl p-2 flex flex-col items-center justify-between cursor-grab active:cursor-grabbing shadow-sm relative transition";
                card.setAttribute('draggable', 'true');

                card.innerHTML = `
                    <button onclick="speakMandarin('${item.word}', event)" title="聽標準普通話發音" class="absolute top-1 right-1 w-6 h-6 bg-white hover:bg-sky-100 text-sky-600 rounded-full flex items-center justify-center text-[10px] shadow-sm transition active:scale-90 border border-sky-200">
                        🔊
                    </button>
                    <span class="text-[11px] font-semibold text-amber-600 tracking-wider mt-0.5">${item.pinyin}</span>
                    <span class="text-lg md:text-xl font-black text-slate-800 my-0.5 tracking-wide">${item.word}</span>
                `;

                card.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', item.id);
                });

                card.addEventListener('click', () => {
                    handleWordCardClick(item);
                });

                grid.appendChild(card);
            });
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mute-icon').innerText = isMuted ? '🔇' : '🔊';
            document.getElementById('mute-text').innerText = isMuted ? '靜音中' : '音效開';
        }

        function initGame() {
            // 隨機選取一種天氣
            const randomIndex = Math.floor(Math.random() * WEATHER_DATA.length);
            currentWeather = WEATHER_DATA[randomIndex];

            // 渲染天氣 SVG 圖案
            const imageContainer = document.getElementById('weather-image-container');
            imageContainer.innerHTML = `
                ${currentWeather.svg}
                <span class="text-[10px] text-sky-300/80 font-mono mt-0.5">天氣情境圖</span>
            `;

            clearSlot();
            renderWordGrid();
        }

        window.onload = function() {
            initGame();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => getMandarinVoice();
            }
        };
    </script>
</body>
</html>
